# Pages CMS configuration: https://pagescms.org/docs/
# Fields here must stay in sync with the schemas in src/content.config.ts.

media:
  # Images inside post text, served as-is from /images.
  - name: images
    label: Post images
    input: public/images
    output: /images
    rename: safe
    categories: [image]
  # Cover images live in src/ so Astro can resize them. The output is the path
  # relative to a post file (src/content/posts/*.md), which is what Astro expects.
  - name: covers
    label: Cover images
    input: src/assets/covers
    output: ../../assets/covers
    rename: safe
    categories: [image]

content:
  - name: home
    label: Home page
    type: file
    path: src/content/pages/home.md
    fields:
      - name: heading
        label: Greeting
        type: string
        required: true
      - name: body
        label: Introduction
        description: Around 150 words lines up best with the photo on wide screens.
        type: rich-text
        options:
          format: markdown
          media: false

  - name: posts
    label: Blog posts
    type: collection
    path: src/content/posts
    filename: '{primary}.md'
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: string
        default: General
      - name: summary
        label: Summary
        description: One or two sentences shown on the blog page.
        type: text
      - name: cover
        label: Cover image
        description: Optional. Shown as a square thumbnail on the blog page.
        type: image
        options:
          media: covers
      - name: coverAlt
        label: Cover description
        description: A few words describing the cover, for screen readers.
        type: string
      - name: draft
        label: Draft
        description: Drafts are saved but not shown on the site.
        type: boolean
        default: false
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
          media: images
